name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    # `development` is the integration branch — everything lands here first, so
    # CI must run on it. Previously only `main` was covered, which meant the
    # entire development workflow merged unvalidated and problems only surfaced
    # on the development -> main PR.
    branches: [main, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match the lockfile + pnpm-workspace.yaml format. pnpm 9 fails
          # with "packages field missing or empty" on a settings-only workspace
          # file, which is the pnpm 11 layout this repo uses.
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders so `next build` doesn't fail on missing env.
          HSC_API_BASE_URL: http://localhost:8000
          HSC_CLIENT_ID: ci_placeholder
          HSC_CLIENT_SECRET: ci_placeholder
          SESSION_COOKIE_SECRET: ci_placeholder_session_secret_min_32_bytes
          NEXT_PUBLIC_HSC_API_BASE_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match the lockfile + pnpm-workspace.yaml format. pnpm 9 fails
          # with "packages field missing or empty" on a settings-only workspace
          # file, which is the pnpm 11 layout this repo uses.
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          HSC_API_BASE_URL: http://localhost:8000
          HSC_CLIENT_ID: ci_placeholder
          HSC_CLIENT_SECRET: ci_placeholder
          SESSION_COOKIE_SECRET: ci_placeholder_session_secret_min_32_bytes
          NEXT_PUBLIC_HSC_API_BASE_URL: http://localhost:8000
